name: Build VocalVerify Ngrok Guard APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap Gradle wrapper when absent
        run: |
          if [ ! -f ./gradlew ]; then
            curl --fail --location --silent --show-error --output gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q gradle.zip
            ./gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          fi
      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VocalVerify-Ngrok-CallGuard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
