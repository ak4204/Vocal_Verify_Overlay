name: Build Android debug APK

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project was created without a checked-in Gradle wrapper. Bootstrap one
      # in CI so the first push can build; commit the generated wrapper afterwards.
      - name: Bootstrap Gradle wrapper when absent
        run: |
          if [ ! -f ./gradlew ]; then
            curl --fail --location --silent --show-error \
              --output gradle-8.10.2-bin.zip \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q gradle-8.10.2-bin.zip
            ./gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          fi

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalVerify-CallGuard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
